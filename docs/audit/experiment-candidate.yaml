experiment: xolver-audit-candidate
description: Query lifecycle, evidence kernels and soundness repairs; server validation.
environment:
  host: panda1
  workdir: /pub/data/jiafq/xolver
protocol:
  inputs: {list: [candidate]}
  timeout: 90m
  memory: 16G
  parallelism: 1
trials:
  - {name: proofs-on}
run:
  cmd: bash /pub/data/jiafq/xolver/tools/remote/validate.sh candidate
measurements:
  from: metrics.json
  primary: unit_rc
  checks: ["unit_rc == 0", "regression_rc == 0", "tools_rc == 0", "known_gaps_rc == 0"]
