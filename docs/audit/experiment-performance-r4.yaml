experiment: xolver-audit-performance-implementation-r4
description: Alternating paired runs, 48 inputs selected from pre-change evidence, three repetitions.
environment:
  host: panda1
  workdir: /pub/data/jiafq/xolver
protocol:
  inputs: {list: [paired-regression]}
  timeout: 90m
  memory: 8G
  parallelism: 1
trials:
  - {name: paired}
run:
  cmd: >-
    python3 tools/remote/paired_suite.py
    --baseline /pub/data/jiafq/xolver/validation/config-plan/xolver
    --candidate /pub/data/jiafq/xolver/validation/implementation-r4/xolver
    --corpus docs/audit/paired-corpus-r2.txt
    --output validation/performance-implementation-r4
measurements:
  from: metrics.json
  primary: geomean_speedup
  checks: ["errors == 0", "disagreements == 0", "comparable > 0"]
