experiment: xolver-pa-isabelle-r8
description: Independently prove new mixed quantifier/piecewise semantics and distinct fixes; R7 retains the 24-case stress result.
environment:
  host: panda1
  workdir: /pub/data/jiafq/xolver
protocol:
  inputs: {list: [pa-kernel-replay]}
  timeout: 20m
  memory: 32G
  parallelism: 1
trials:
  - {name: kernel}
run:
  cmd: >-
    python3 validation/native-terms-r16/inputs/tools/remote/test_pa_isabelle.py
    --solver /pub/data/jiafq/xolver/validation/native-terms-r16/xolver
    --isabelle /pub/data/jiafq/xolver/dependencies/isabelle/Isabelle2025-2/bin/isabelle
    --cache /pub/data/jiafq/xolver/build/isabelle
    --sample 0
    --output /pub/data/jiafq/xolver/validation/pa-isabelle-r8
measurements:
  from: metrics.json
  primary: verified_claims
  checks: ["passed == 1"]
