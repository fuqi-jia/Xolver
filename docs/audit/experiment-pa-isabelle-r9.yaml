experiment: xolver-pa-isabelle-r9
description: Expand model let assignments, check all 45 semantic/stress claims, and reject corrupted normalization hints.
environment:
  host: panda1
  workdir: /pub/data/jiafq/xolver
protocol:
  inputs: {list: [pa-kernel-replay]}
  timeout: 30m
  memory: 32G
  parallelism: 1
trials:
  - {name: kernel}
run:
  cmd: >-
    python3 build/pa-kernel-r9/test_pa_isabelle.py
    --solver /pub/data/jiafq/xolver/validation/native-terms-r16/xolver
    --isabelle /pub/data/jiafq/xolver/dependencies/isabelle/Isabelle2025-2/bin/isabelle
    --cache /pub/data/jiafq/xolver/build/isabelle
    --pa-report /pub/data/jiafq/xolver/validation/pa-native-terms-r12/report.json
    --output /pub/data/jiafq/xolver/validation/pa-isabelle-r9
measurements:
  from: metrics.json
  primary: verified_claims
  checks: ["passed == 1"]
