experiment: xolver-architecture-r1
description: Enforced source layers, isolated evidence checker, extracted preprocessing and shared numeric decoding.
environment:
  host: panda1
  workdir: /pub/data/jiafq/xolver
protocol:
  inputs: {list: [architecture]}
  timeout: 100m
  memory: 16G
  parallelism: 1
trials:
  - {name: native}
run:
  cmd: bash tools/remote/build.sh build/architecture-r1-source.tar.gz && XOLVER_REGRESSION_TIMEOUT=240 XOLVER_REGRESSION_JOBS=1 bash tools/remote/validate.sh architecture-r1
measurements:
  from: metrics.json
  primary: unit_rc
  checks: ["unit_rc == 0", "regression_rc == 0", "tools_rc == 0", "known_gaps_rc == 0"]
