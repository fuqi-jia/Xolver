experiment: xolver-pa-piecewise-r15
description: Compare 180 mixed Boolean/integer quantifier and piecewise formula pairs against Z3 and cvc5.
environment:
  host: panda1
  workdir: /pub/data/jiafq/xolver
protocol:
  inputs: {list: [mixed-pa]}
  timeout: 45m
  memory: 8G
  parallelism: 1
trials:
  - {name: piecewise}
run:
  cmd: >-
    python3 tools/fuzz/fuzz_pa_syntax.py
    --suite piecewise --n 180
    --solver /pub/data/jiafq/xolver/validation/native-terms-r15/xolver
    --z3 /pub/data/jiafq/xolver/dependencies/oracles/z3
    --cvc5 /pub/data/jiafq/z3-native-audit-tools-20260924-r3/cvc5/bin/cvc5
    --output validation/pa-piecewise-r15
measurements:
  from: metrics.json
  primary: checked
  checks: ["checked == 180", "mismatches == 0", "inconclusive == 0"]
